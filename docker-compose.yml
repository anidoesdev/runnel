services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_POSTGRES_DATABASE:-n8n_clone}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  cli:
    build:
      context: .
      dockerfile: packages/cli/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Fails fast with a clear message rather than silently falling back to the insecure
      # dev defaults baked into config.ts — those are meant for local `node dist/bin.js
      # start` only, never for a container that might actually be reachable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY (see docs/environment-variables.md)}
      N8N_JWT_SECRET: ${N8N_JWT_SECRET:?Set N8N_JWT_SECRET (see docs/environment-variables.md)}
      PORT: 5679
      DB_TYPE: postgres
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: ${DB_POSTGRES_USER:-postgres}
      DB_POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-postgres}
      DB_POSTGRES_DATABASE: ${DB_POSTGRES_DATABASE:-n8n_clone}
      CUSTOM_NODES_DIR: ${CUSTOM_NODES_DIR:-}
    ports:
      - '5679:5679'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5679/healthz/readiness']
      interval: 5s
      timeout: 5s
      retries: 10

  editor-ui:
    build:
      context: .
      dockerfile: packages/editor-ui/Dockerfile
    environment:
      CLI_UPSTREAM: cli:5679
    depends_on:
      cli:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  postgres-data:
