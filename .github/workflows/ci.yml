name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: n8n_clone_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5433
      TEST_POSTGRES_USER: postgres
      TEST_POSTGRES_PASSWORD: postgres
      TEST_POSTGRES_DATABASE: n8n_clone_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes dependency-direction check)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Assistant evals
        id: evals
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        working-directory: packages/assistant
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_REPORT_PATH: eval-report.json
        run: pnpm run evals

      - name: Upload eval report
        if: ${{ always() && steps.evals.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: assistant-eval-report
          path: packages/assistant/eval-report.json
          if-no-files-found: ignore
